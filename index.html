document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

secondary: var(--color-teal-600);\n  --accent-highlight: var(--color-coral-500);\n  --accent-tint: var(--color-lightblue-300);\n  --dataviz-1: var(--color-petroleum-900);\n  --dataviz-2: var(--color-teal-600);\n  --dataviz-3: var(--color-coral-500);\n  --dataviz-4: var(--color-lightblue-300);\n  --dataviz-5: var(--color-gray-400);\n\n  /* --- Borders / dividers --- */\n  --border-subtle: rgba(15, 76, 92, 0.15);   /* Primary @ 15% */\n  --border-strong: rgba(15, 76, 92, 0.30);\n  --border-hairline: var(--color-gray-200);\n\n  /* --- Footer (editorial footer system) --- */\n  --footer-text: rgba(55, 65, 81, 0.75);\n  --footer-divider: rgba(15, 76, 92, 0.18);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   TYPE SCALE — dramatic, oversized where it earns its place.\n   Hierarchy is built with weight + size + spacing, never a\n   second font family.\n   ============================================================ */\n\n:root {\n  /* Hero / editorial scale (cover titles, hero stats, chapter numbers) */\n  --font-size-hero: clamp(96px, 11vw, 200px);\n  --font-size-display: clamp(64px, 6vw, 104px);\n\n  /* Slide-level hierarchy */\n  --font-size-h1: 56px;   /* Main titles — SemiBold */\n  --font-size-h2: 34px;   /* Section titles — Medium */\n  --font-size-h3: 24px;   /* Card / sub-section titles — Medium */\n  --font-size-label: 14px; /* Eyebrow labels — Medium, tracked */\n  --font-size-body: 18px;  /* Body — Regular */\n  --font-size-body-lg: 21px;\n  --font-size-small: 14px; /* Captions — Regular/Light */\n  --font-size-footer: 11px; /* Footer / sources — Light */\n\n  --line-height-tight: 1.05;\n  --line-height-heading: 1.15;\n  --line-height-body: 1.55;\n\n  --tracking-label: 0.08em;\n  --tracking-tight: -0.02em;\n}\n\n.gz-eyebrow {\n  font-family: var(--font-family);\n  font-weight: var(--weight-medium);\n  font-size: var(--font-size-label);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n  color: var(--accent-secondary);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   SPACING & GEOMETRY — editorial grid, generous white space.\n   ============================================================ */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Slide safe area (1920×1080 canvas) */\n  --slide-margin-x: 120px;\n  --slide-margin-top: 96px;\n  --slide-margin-bottom: 88px;\n\n  /* Radii — 10–12px, never sharp, never pill-heavy */\n  --radius-sm: 8px;\n  --radius-card: 12px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   EFFECTS — shadows stay near-invisible; no gradients except\n   the one extremely-subtle hairline wash used on dividers.\n   ============================================================ */\n\n:root {\n  --shadow-card: 0 1px 2px rgba(15, 76, 92, 0.05), 0 6px 16px rgba(15, 76, 92, 0.06);\n  --shadow-card-hover: 0 2px 4px rgba(15, 76, 92, 0.06), 0 12px 24px rgba(15, 76, 92, 0.09);\n  --shadow-none: none;\n\n  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-fast: 150ms; /* @kind other */\n  --duration-base: 260ms; /* @kind other */\n\n  --wash-subtle: linear-gradient(180deg, rgba(142, 201, 210, 0.10), rgba(142, 201, 210, 0)); /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   FONTS — Poppins, exclusively. All weights loaded via Google\n   Fonts (no local binaries were supplied by the brand owner).\n   ============================================================ */\n\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"38d6cd68-fa12-4a0b-a308-e37db5f0c93c\") format nt-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"1ba975d6-abf5-4bc6-8a39-8407a3886f22\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* devanagari */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"769f90d7-4db5-4b66-bbbc-d4340dafa8fe\") format('woff2');\n  unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4d357005-0970-49bb-85cb-080af9de5770\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Poppins';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d42e3196-be9b-4cd6-ac37-8077a11659eb\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;\n\n  --weight-extrabold: 800;  /* Cover titles, chapter numbers, hero stats */\n  --weight-semibold: 600;   /* Main titles */\n  --weight-medium: 500;     /* Section titles, labels */\n  --weight-regular: 400;    /* Body text */\n  --weight-light: 300;      /* Footnotes, sources, captions */\n}\n\n/* ============================================================\n   COLOR TOKENS — María Angélica Galezzo Academic Design System\n   Deep Petroleum Blue is the anchor; the palette stays mostly\n   white. Color marks hierarchy, it does not decorate.\n   ============================================================ */\n\n:root {\n  /* --- Base palette (raw brand values) --- */\n  --color-petroleum-900: #0F4C5C;   /* Primary — Deep Petroleum Blue */\n  --color-petroleum-700: #14657A;\n  --color-teal-600: #2A9D8F;        /* Secondary */\n  --color-coral-500: #E76F51;       /* Accent */\n  --color-lightblue-300: #8EC9D2;\n  --color-white: #FFFFFF;\n  --color-gray-050: #F7F9FB;        /* Light Gray */\n  --color-gray-700: #374151;        /* Dark Gray */\n  --color-gray-400: #8B93A1;\n  --color-gray-200: #E4E9EE;\n\n  /* --- Semantic surfaces --- */\n  --surface-page: var(--color-white);\n  --surface-alt: var(--color-gray-050);\n  --surface-card: var(--color-white);\n  --surface-inverse: var(--color-petroleum-900);\n\n  /* --- Semantic text --- */\n  --text-heading: var(--color-petroleum-900);\n  --text-body: var(--color-gray-700);\n  --text-muted: rgba(55, 65, 81, 0.72);      /* Dark Gray @ ~72% */\n  --text-inverse: var(--color-white);\n  --text-accent: var(--color-coral-500);\n\n  /* --- Semantic accents / data-viz palette (in-order use) --- */\n  --accent-primary: var(--color-petroleum-900);\n  --accent-secondary: var(--color-teal-600);\n  --accent-highlight: var(--color-coral-500);\n  --accent-tint: var(--color-lightblue-300);\n  --dataviz-1: var(--color-petroleum-900);\n  --dataviz-2: var(--color-teal-600);\n  --dataviz-3: var(--color-coral-500);\n  --dataviz-4: var(--color-lightblue-300);\n  --dataviz-5: var(--color-gray-400);\n\n  /* --- Borders / dividers --- */\n  --border-subtle: rgba(15, 76, 92, 0.15);   /* Primary @ 15% */\n  --border-strong: rgba(15, 76, 92, 0.30);\n  --border-hairline: var(--color-gray-200);\n\n  /* --- Footer (editorial footer system) --- */\n  --footer-text: rgba(55, 65, 81, 0.75);\n  --footer-divider: rgba(15, 76, 92, 0.18);\n}\n\n/* ============================================================\n   TYPE SCALE — dramatic, oversized where it earns its place.\n   Hierarchy is built with weight + size + spacing, never a\n   second font family.\n   ============================================================ */\n\n:root {\n  /* Hero / editorial scale (cover titles, hero stats, chapter numbers) */\n  --font-size-hero: clamp(96px, 11vw, 200px);\n  --font-size-display: clamp(64px, 6vw, 104px);\n\n  /* Slide-level hierarchy */\n  --font-size-h1: 56px;   /* Main titles — SemiBold */\n  --font-size-h2: 34px;   /* Section titles — Medium */\n  --font-size-h3: 24px;   /* Card / sub-section titles — Medium */\n  --font-size-label: 14px; /* Eyebrow labels — Medium, tracked */\n  --font-size-body: 18px;  /* Body — Regular */\n  --font-size-body-lg: 21px;\n  --font-size-small: 14px; /* Captions — Regular/Light */\n  --font-size-footer: 11px; /* Footer / sources — Light */\n\n  --line-height-tight: 1.05;\n  --line-height-heading: 1.15;\n  --line-height-body: 1.55;\n\n  --tracking-label: 0.08em;\n  --tracking-tight: -0.02em;\n}\n\n.gz-eyebrow {\n  font-family: var(--font-family);\n  font-weight: var(--weight-medium);\n  font-size: var(--font-size-label);\n  letter-spacing: var(--tracking-label);\n  text-transform: uppercase;\n  color: var(--accent-secondary);\n}\n\n/* ============================================================\n   SPACING & GEOMETRY — editorial grid, generous white space.\n   ============================================================ */\n\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  /* Slide safe area (1920×1080 canvas) */\n  --slide-margin-x: 120px;\n  --slide-margin-top: 96px;\n  --slide-margin-bottom: 88px;\n\n  /* Radii — 10–12px, never sharp, never pill-heavy */\n  --radius-sm: 8px;\n  --radius-card: 12px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;\n}\n\n/* ============================================================\n   EFFECTS — shadows stay near-invisible; no gradients except\n   the one extremely-subtle hairline wash used on dividers.\n   ============================================================ */\n\n:root {\n  --shadow-card: 0 1px 2px rgba(15, 76, 92, 0.05), 0 6px 16px rgba(15, 76, 92, 0.06);\n  --shadow-card-hover: 0 2px 4px rgba(15, 76, 92, 0.06), 0 12px 24px rgba(15, 76, 92, 0.09);\n  --shadow-none: none;\n\n  --ease-editorial: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --duration-fast: 150ms; /* @kind other */\n  --duration-base: 260ms; /* @kind other */\n\n  --wash-subtle: linear-gradient(180deg, rgba(142, 201, 210, 0.10), rgba(142, 201, 210, 0)); /* @kind other */\n}\n\n\nbody {\n  font-family: var(--font-family);\n  color: var(--text-body);\n  background: var(--surface-page);\n  margin: 0;\n}\n<\u002Fstyle>\n  <script src=\"f94678c0-ba50-4c4e-9797-a3c17566ab16\"><\u002Fscript>\n  <script src=\"2d550d91-06fd-4832-895c-518ec7c129e3\"><\u002Fscript>\n  <style id=\"__om-edit-overrides\"><\u002Fstyle>\n  <style>\n    doc-page:not(:defined){visibility:hidden}\n    html{lang:es}\n    body{font-family: var(--font-family, 'Poppins', sans-serif); user-select:none; -webkit-user-select:none; -moz-user-select:none;}\n    a{color: var(--color-petroleum-900); text-decoration: underline;}\n    a:hover{color: var(--color-teal-600);}\n    table{border-collapse: collapse; width: 100%;}\n    th, td{border-bottom: 1px solid var(--border-hairline); padding: 10px 12px; text-align: left; vertical-align: top; font-size: 14px; line-height: 1.55;}\n    th{background: var(--surface-alt); color: var(--text-heading); font-weight: 600; font-size: 13px; letter-spacing: 0.02em;}\n    tr:last-child td{border-bottom: none;}\n    ::selection{background:transparent;}\n  <\u002Fstyle>\n\n\n<doc-page margin=\"0.85in\" oncontextmenu=\"return false\" onselectstart=\"return false\" oncopy=\"return false\" oncut=\"return false\" onpaste=\"return false\" ondragstart=\"return false\">\n\n  <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:6px;\">\n    <span style=\"font-family:var(--font-family); font-weight:600; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--color-teal-600); background:rgba(42,157,143,0.1); padding:4px 10px; border-radius:999px;\">Guía del estudiante<\u002Fspan>\n    <span style=\"font-family:var(--font-family); font-weight:500; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted);\">Entrega 2 · 35% de la nota<\u002Fspan>\n  <\u002Fdiv>\n\n  <h1 style=\"font-family:var(--font-family); font-weight:600; font-size:32px; line-height:1.15; color:var(--color-petroleum-900); margin:0 0 4px 0; letter-spacing:-0.01em;\">Guía del Estudiante — Entrega 2<\u002Fh1>\n  <p style=\"font-family:var(--font-family); font-weight:400; font-size:16px; color:var(--text-muted); margin:0 0 4px 0;\">Seminario de Ingeniería Química · Proyecto ABP Colcerámica<\u002Fp>\n  <p style=\"font-family:var(--font-family); font-weight:500; font-size:18px; color:var(--color-teal-600); margin:0 0 20px 0; font-style:italic;\">Propuesta conceptual de solución<\u002Fp>\n\n  <div style=\"display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:0; border:1px solid var(--border-hairline); border-radius:12px; overflow:hidden; margin-bottom:28px; break-inside:avoid;\">\n    <div style=\"padding:14px 18px; border-right:1px solid var(--border-hairline);\">\n      <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:4px;\">Peso en el proyecto<\u002Fdiv>\n      <div style=\"font-size:20px; font-weight:600; color:var(--color-petroleum-900);\">35%<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 18px; border-right:1px solid var(--border-hairline);\">\n      <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:4px;\">Fecha de entrega<\u002Fdiv>\n      <div style=\"font-size:20px; font-weight:600; color:var(--color-petroleum-900);\">Viernes 2 de octubre de 2026<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:14px 18px;\">\n      <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:4px;\">Modalidad<\u002Fdiv>\n      <div style=\"font-size:20px; font-weight:600; color:var(--color-petroleum-900);\">Grupal<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">1. Presentación<\u002Fh2>\n  <p style=\"font-size:15px; line-height:1.7; color:var(--text-body); margin:0 0 12px 0;\">Esta guía te acompaña en la construcción de la <strong>Entrega 2<\u002Fstrong> del proyecto integrador del semestre: la <em>Propuesta conceptual de solución<\u002Fem> al problema real de <strong>Colcerámica S.A.S. (Grupo Corona) — Planta Madrid<\u002Fstrong>.<\u002Fp>\n  <p style=\"font-size:15px; line-height:1.7; color:var(--text-body); margin:0;\">En la Entrega 1 justificaste la ruta de solución seleccionada a partir de tu diagnóstico (Ishikawa + BFD). Ahora te toca convertir esa ruta en una propuesta técnica completa: un PFD que muestre la intervención, un análisis DOFA y PESTAL de tu solución, un HAZOP estructurado y una estimación de costos con datos reales de la empresa.<\u002Fp>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">2. Objetivo de aprendizaje<\u002Fh2>\n  <p style=\"font-size:15px; line-height:1.7; color:var(--text-body); margin:0;\">Al finalizar esta entrega, tu equipo debe ser capaz de presentar una <strong>propuesta conceptual completa de solución<\u002Fstrong> para el problema de Colcerámica dentro de la ruta que eligieron, integrando el PFD, el DOFA, el HAZOP y la estimación de costos <strong>como un sistema coherente<\u002Fstrong>, no como ejercicios sueltos, y usando datos reales de la empresa.<\u002Fp>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">3. Contexto del proyecto<\u002Fh2>\n  <ul style=\"font-size:15px; line-height:1.7; color:var(--text-body); margin:0 0 12px 0; padding-left:20px;\">\n    <li><strong>Empresa aliada:<\u002Fstrong> Colcerámica S.A.S. (Grupo Corona) · Planta Madrid<\u002Fli>\n    <li><strong>Modalidad de trabajo:<\u002Fstrong> grupos de 3-4 estudiantes<\u002Fli>\n    <li><strong>Prerrequisito:<\u002Fstrong> tu ruta de solución declarada y aprobada en la Entrega 1<\u002Fli>\n  <\u002Ful>\n  <div style=\"background:var(--surface-alt); border-left:3px solid var(--color-coral-500); border-radius:8px; padding:14px 16px; break-inside:avoid;\">\n    <p style=\"font-size:14px; line-height:1.6; color:var(--text-body); margin:0;\">Recuerda: todo lo que construyas en esta entrega debe conectarse explícitamente con los datos reales de Colcerámica que ya trabajaste en la Entrega 1. Una propuesta que podría aplicarse a \"cualquier planta cerámica\" no cumple el objetivo de esta entrega.<\u002Fp>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">4. Qué deben entregar<\u002Fh2>\n  <p style=\"font-size:15px; line-height:1.7; color:var(--text-body); margin:0 0 10px 0;\"><strong>Entregable grupal (documento):<\u002Fstrong><\u002Fp>\n  <ol style=\"font-size:15px; line-height:1.75; color:var(--text-body); margin:0; padding-left:20px;\">\n    <li style=\"margin-bottom:8px;\"><strong>PFD<\u002Fstrong> del proceso — si la propuesta de mejora está involucrada en los equipos, se debe evidenciar la intervención concreta.<\u002Fli>\n    <li style=\"margin-bottom:8px;\"><strong>Análisis PESTAL <\u002Fstrong>acotado a los factores que afectan la viabilidad de tu solución específica en Colcerámica.<\u002Fli>\n    <li style=\"margin-bottom:8px;\"><strong>DOFA<\u002Fstrong> apuntando específicamente a la solución (no a la organización en general).<\u002Fli>\n    <li style=\"margin-bottom:8px;\"><strong>HAZOP<\u002Fstrong> con mínimo 3 nodos, cada uno con desviación, causa, consecuencia y acción correctiva diferenciadas.<\u002Fli>\n    <li style=\"margin-bottom:8px;\"><strong>Estimación de costos<\u002Fstrong> (Clase 1, ±50%) usando datos reales de Colcerámica: índice de consumo (IC) 0.76–0.913 KWh/m², distribución 60/40, rubros de costo (esmaltes 23.2%, combustibles 19.6%, energía 9.0%).<\u002Fli>\n    <li><strong>Análisis ético y de impacto (CPIQ)<\u002Fstrong> conectado con impactos reales en Colcerámica (residuos, condiciones laborales en la etapa intervenida, ODS 9).<\u002Fli>\n  <\u002Fol>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">5. Estructura del entregable<\u002Fh2>\n  <sc-raw-table>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:22%;\">Componente<\u002Fsc-raw-th><sc-raw-th>Qué debe mostrar<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td><strong>PFD<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>El PFD del proceso, evidenciando la modificación propuesta.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td><strong>PESTAL<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Acotado a factores que afectan la viabilidad de tu solución en Colcerámica.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td><strong>HAZOP<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Específico de tu solución y tu ruta — no genérico.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td><strong>HAZOP<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>≥3 nodos con 4 columnas diferenciadas: desviación / causa / consecuencia / acción correctiva.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td><strong>Estimación de costos<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Con al menos 2 datos reales de Colcerámica.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td><strong>Análisis ético/impacto<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Conectado con impactos reales de la solución en Colcerámica.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family:var(--font-family); font-weight:600; font-size:22px; color:var(--color-petroleum-900); margin:32px 0 10px 0; padding-bottom:8px; border-bottom:2px solid var(--color-petroleum-900);\">6. Rúbrica de evaluación<\u002Fh2>\n  <p style=\"font-size:14px; line-height:1.6; color:var(--text-muted); margin:0 0 12px 0;\"><strong>Escala:<\u002Fstrong> Excelente 5.0 · Avanzado 3.75–4.9 · Progresivo 2.5–3.74 · Inicial 1.25–2.49 · Sin evidencia 0<\u002Fp>\n  <sc-raw-table>\n    <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:5%;\">#<\u002Fsc-raw-th><sc-raw-th style=\"width:22%;\">Criterio<\u002Fsc-raw-th><sc-raw-th style=\"width:10%;\">Peso<\u002Fsc-raw-th><sc-raw-th>Nivel Excelente (5.0) — qué se espera<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Calidad de la argumentación · Coherencia entre PFD, DOFA y HAZOP<\u002Fsc-raw-td><sc-raw-td>28%<\u002Fsc-raw-td><sc-raw-td>Los tres componentes son coherentes entre sí y con la ruta de la Entrega 1. La viabilidad de tu solución se sostiene de forma integrada, no como secciones independientes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Aplicación práctica · Estimación de costos y viabilidad<\u002Fsc-raw-td><sc-raw-td>25%<\u002Fsc-raw-td><sc-raw-td>Estimación Clase 1 (±50%) con datos reales de Colcerámica. Incluye costo estimado, ahorro esperado por reducción de fisura y tiempo de recuperación argumentado.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Rigor conceptual · HAZOP metodológico y PESTAL acotado<\u002Fsc-raw-td><sc-raw-td>20%<\u002Fsc-raw-td><sc-raw-td>HAZOP con ≥3 nodos completos y diferenciados. PESTAL acotado solo a lo que afecta la viabilidad de tu solución específica.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Creatividad · Análisis ético y de impacto (CPIQ)<\u002Fsc-raw-td><sc-raw-td>17%<\u002Fsc-raw-td><sc-raw-td>El análisis va más allá de lo declarativo: cuantifica o estima impactos concretos de tu solución en Colcerámica.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Presentación y forma<\u002Fsc-raw-td><sc-raw-td>10%<\u002Fsc-raw-td><sc-raw-td>Documento técnico bien estructurado, diagramas legibles con convenciones de ingeniería, referencias completas.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n<\u002Fdoc-page>\n]]&gt;\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._block = (e) => {\n      const k = e.key ? e.key.toLowerCase() : '';\n      if ((e.ctrlKey || e.metaKey) && ['c','x','a','p','s','u'].includes(k)) e.preventDefault();\n      if (k === 'f12') e.preventDefault();\n    };\n    document.addEventListener('keydown', this._block);\n    document.addEventListener('contextmenu', (e) => e.preventDefault());\n  }\n  componentWillUnmount() {\n    document.removeEventListener('keydown', this._block);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
